[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rimworld-mcp"
version = "0.1.0"
description = "Independent, local-only RimWorld tooling for MCP clients"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "RimWorld MCP contributors" }]
dependencies = [
  "mcp[cli]>=2.0.0",
  "platformdirs>=4.4",
]

[project.optional-dependencies]
csharp-parser = ["tree-sitter>=0.25", "tree-sitter-c-sharp>=0.23"]
dev = ["mypy>=1.18", "pytest>=8.4", "ruff>=0.12"]

[project.scripts]
rimworld-mcp = "rimworld_mcp.mcp_server:main"
rimworld-mcp-daemon = "rimworld_mcp.daemon.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["rimworld_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["rimworld_mcp"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rimworld_mcp.mcp_server"]
disable_error_code = ["untyped-decorator"]
