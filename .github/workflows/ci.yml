name: CI

on:
  push:
  pull_request:

jobs:
  # 平台契約在三個 OS 上都必須真的執行：junction 與程序語意在各平台不同，
  # 只在一個平台跑等於失去防護。
  platform-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - run: dotnet test tests/RimWorldModMcp.PlatformContracts.Tests --configuration Release

  # 其餘測試與平台無關，跑一次就夠。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - run: dotnet build RimWorldModMcp.slnx --configuration Release
      - run: dotnet test tests/RimWorldModMcp.Core.Tests --configuration Release --no-build
      - run: dotnet test tests/RimWorldModMcp.Indexing.Tests --configuration Release --no-build
      - run: dotnet test tests/RimWorldModMcp.Diagnostics.Tests --configuration Release --no-build
      - run: dotnet test tests/RimWorldModMcp.Server.Tests --configuration Release --no-build

  # 確認 dotnet tool 打包成功且能被安裝——SQLite 的原生程式庫是靠
  # runtimes/<rid>/native 解析的，打包成功但執行期載入失敗是典型的陷阱。
  pack:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - run: dotnet pack src/RimWorldModMcp.Server --configuration Release -o ./nupkg
      # 預編譯的 Bridge 必須在套件裡：少了它，run_test_cycle 會退回就地建置並要求本機 SDK。
      # 用 python 讀 zip：三個 runner 都有 python3，unzip 在 windows 的 bash 不保證有，
      # 而 macOS 的 wc -l 輸出帶前導空白，不能直接與數字比對。
      - run: |
          python3 - <<'EOF'
          import glob, sys, zipfile
          package = zipfile.ZipFile(glob.glob("nupkg/*.nupkg")[0])
          names = set(package.namelist())
          missing = [f for f in ("RimWorldModMcp.Bridge.dll", "0Harmony.dll", "game-version.txt")
                     if f"tools/net10.0/any/bridge/Prebuilt/{f}" not in names]
          if missing:
              sys.exit(f"prebuilt bridge files missing from package: {missing}")
          # RimWorld 跑在 Mono 上，只載得了 net472；編成其他目標框架的 Bridge 等於沒有。
          bridge = package.read("tools/net10.0/any/bridge/Prebuilt/RimWorldModMcp.Bridge.dll")
          if b".NETFramework,Version=v4.7.2" not in bridge:
              sys.exit("prebuilt bridge is not built for net472")
          EOF
        shell: bash
      # 版本號讀自 csproj，升版時不必同步改這裡。
      - run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/RimWorldModMcp.Server/RimWorldModMcp.Server.csproj | head -n1)
          dotnet tool install -g RimWorldModMcp --add-source ./nupkg --version "$version"
        shell: bash
      # detect 在沒有安裝 RimWorld 的 runner 上會回傳非零，這是預期的；
      # 這裡要驗的是工具能啟動、相依能解析。
      - run: rimworld-mod-mcp detect || true
        shell: bash

  # main 上的測試全數通過後，若 csproj 的版本號還沒有對應標籤就建立標籤並派送 Release。
  # 版本號沒變就什麼都不做，所以一般的 push 不會重複發版。
  tag:
    needs: [platform-contracts, test, pack]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/RimWorldModMcp.Server/RimWorldModMcp.Server.csproj | head -n1)
          [ -n "$version" ] || { echo "找不到 <Version>"; exit 1; }
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag 已存在，略過"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          gh workflow run release.yml --ref "$tag"
        env:
          GH_TOKEN: ${{ github.token }}
